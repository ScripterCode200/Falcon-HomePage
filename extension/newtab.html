<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falcon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 480px;
      padding: 32px;
      display: none; /* Only shown if connection fails */
      animation: fadeIn 0.4s ease forwards;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 20px;
      box-shadow: 0 4px 24px rgba(56, 189, 248, 0.25);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #f8fafc;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 18px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button, a.btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: none;
    }
    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container" id="error-card">
    <img src="FAV_Final.png" alt="Falcon" class="logo">
    <h1>Unable to connect to Falcon</h1>
    <div class="badge" id="target-url-badge">http://localhost:3000</div>
    <p id="error-desc">
      Make sure your Next.js server is running (<code>npm run dev</code>), or update your extension settings to your deployed cloud URL.
    </p>
    <div class="btn-group">
      <button class="btn btn-primary" id="retry-btn">Retry Connection</button>
      <a href="options.html" class="btn btn-secondary">Settings</a>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
